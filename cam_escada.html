<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor - Cam Escada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-papel="vigilante" data-sala="Escada">

    <div class="monitor-container">

        <!-- Câmera -->
        <header class="topo-camera">
            <h1>CAM - Escada</h1>
            <div id="alerta-monstro">⚠️ ALERTA: MONSTRO PRÓXIMO!</div>
        </header>

        <!-- Relógio do tempo restante -->
        <p>Tempo restante: <strong id="tempo">00:00</strong></p>

        <!-- Status e Tela da Câmera com as duas imagens -->
        <section class="status-monstros">
            <div id="cor" class="camera-tela">  
                <!-- 1. Imagem padrão (sem monstro) -->
                <img id="img-normal" src="img/corredor_normal.png" alt="" class="ativa">
                
                <!-- 2. Imagem de perigo (quando o monstro está no cômodo) -->
                <img id="img-monstro" src="img/corredor_monstro.png" alt="" class="escondida">
            </div>

            <!-- Status do monstro em texto -->
            <h2 id="monstro-status">Monstro = Ausente</h2>
        </section>

        <!-- Botões de navegação entre as câmeras -->
        <div class="navegacao-cameras">
            <a href="cam_entrada.html" class="btn-navegacao">← Cam Entrada</a>
            <a href="cam_sala.html" class="btn-navegacao">Cam Sala →</a>
        </div>

    </div>

    <!-- Scripts de Conexão com o Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="conexao.js"></script>
    <script src="script.js"></script>

</body>
</html>
