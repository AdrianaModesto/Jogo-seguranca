<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor - Cam Cozinha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-papel="vigilante" data-sala="Cozinha">

    <div class="monitor-container">

        <!-- Câmera  -->
        <header class="topo-camera">
            <h1>CAM - Cozinha</h1>
            <div id="alerta-monstro">⚠️ ALERTA: MONSTRO PRÓXIMO!</div>
        </header>

        <!-- Relógio do tempo restante -->
        <p>Tempo restante: <strong id="tempo">00:00</strong></p>

        <!-- Status e Tela da Câmera com as duas imagens -->
        <section class="status-monstros">
            <div id="cor" class="camera-tela">  
                <img id="img-normal" src="img/cozinha_normal.png" alt="" class="ativa">
                <img id="img-monstro" src="img/cozinha_monstro.png" alt="" class="escondida">
            </div>

            <h2 id="monstro-status">Monstro = Ausente</h2>
        </section>

        <!-- Botões de navegação -->
        <div class="navegacao-cameras">
            <a href="cam_quarto.html" class="btn-navegacao">← Cam Quarto</a>
            <a href="cam_entrada.html" class="btn-navegacao">Cam Entrada →</a>
        </div>
    <img id="fundo-camera" src="img/cozinha-sem-bicho.png"
     data-img-sem-bicho="img/cozinha-sem-bicho.png"
     data-img-com-bicho="img/cozinha-com-bicho.png"
     alt="Imagem da câmera Sala">

    </section>

    <hr>

    <nav class="navegacao-cameras">
        <p>Trocar de Câmera:</p>
            <a href="cam_cozinha.html">Camera Cozinha</a> | 
            <a href="cam_entrada.html">Camera Entrada</a> | 
            <a href="cam_escada.html">Camera Escada</a> | 
            <a href="cam_quarto.html">Camera Quarto</a> |
            <a href="cam_sala.html" >Camera Sala</a> |
    </nav>
    </div>

    <!-- Ligação com o ficheiro JavaScript externo -->
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
   <script src="conexao.js"></script>
   <script src="jumpscare.js"></script>
   <script src="script.js"></script>
    
</body>
</html>
