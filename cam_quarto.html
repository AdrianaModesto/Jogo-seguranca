<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor - Cam Quarto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-papel="vigilante" data-sala="Quarto">

    <div class="monitor-container">

        <!-- Câmera -->
        <header class="topo-camera">
            <h1>CAM - Quarto</h1>
            <div id="alerta-monstro">⚠️ ALERTA: MONSTRO PRÓXIMO!</div>
        </header>

        <!-- Relógio do tempo restante -->
        <p>Tempo restante: <strong id="tempo">00:00</strong></p>

        <!-- Status e Tela da Câmera com as duas imagens -->
        <section class="status-monstros">
            <div id="cor" class="camera-tela">  
                <img id="img-normal" src="img/quarto_normal.png" alt="" class="ativa">
                <img id="img-monstro" src="img/quarto_monstro.png" alt="" class="escondida">
            </div>

            <h2 id="monstro-status">Monstro = Ausente</h2>
        </section>

        <!-- Botões de navegação -->
        <div class="navegacao-cameras">
            <a href="cam_sala.html" class="btn-navegacao">← Cam Sala</a>
            <a href="cam_cozinha.html" class="btn-navegacao">Cam Cozinha →</a>
        </div>

    </div>

    <!-- Scripts de Conexão -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="conexao.js"></script>
    <script src="script.js"></script>

</body>
</html>
